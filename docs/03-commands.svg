<text x="70" y="105" fill="url(#g)" font-family="Arial Black, sans-serif" font-size="56" letter-spacing="4">КОМАНДЫ</text><text x="72" y="140" fill="#9fb1bd" font-family="Arial, sans-serif" font-size="20">Основные команды PrimeChat 1.3 и их алиасы</text>
<g font-family="Arial, sans-serif">
<g transform="translate(65 185)"><rect width="330" height="610" rx="14" fill="#0a1d28" stroke="#00e5ff"/><text x="25" y="45" fill="#70edff" font-size="25" font-weight="700">ОБЩЕНИЕ</text><g fill="#e5eef3" font-size="20"><text x="25" y="88">/msg /m /message</text><text x="25" y="118" fill="#9fb1bd">Личные сообщения</text><text x="25" y="170">/r /reply</text><text x="25" y="200" fill="#9fb1bd">Быстрый ответ</text><text x="25" y="252">/g &lt;сообщение&gt;</text><text x="25" y="282" fill="#9fb1bd">Глобальный чат</text><text x="25" y="334">/l &lt;сообщение&gt;</text><text x="25" y="364" fill="#9fb1bd">Локальный чат</text><text x="25" y="416">/dc &lt;сообщение&gt;</text><text x="25" y="446" fill="#9fb1bd">Donate Chat</text><text x="25" y="498">/ac &lt;сообщение&gt;</text><text x="25" y="528" fill="#9fb1bd">Admin Chat</text></g></g>
<g transform="translate(435 185)"><rect width="330" height="610" rx="14" fill="#10142a" stroke="#7c4dff"/><text x="25" y="45" fill="#cbbcff" font-size="25" font-weight="700">УПРАВЛЕНИЕ</text><g fill="#e5eef3" font-size="20"><text x="25" y="88">/pc /pchat</text><text x="25" y="118" fill="#9fb1bd">help • reload • version</text><text x="25" y="170">/chat /ch</text><text x="25" y="200" fill="#9fb1bd">on • off • состояние</text><text x="25" y="252">/cc /clearchat</text><text x="25" y="282" fill="#9fb1bd">Очистка чата</text><text x="25" y="334">/afk</text><text x="25" y="364" fill="#9fb1bd">Статус AFK</text><text x="25" y="416">/ss /socialspy</text><text x="25" y="446" fill="#9fb1bd">Просмотр ЛС</text><text x="25" y="498">/cs /commandspy</text><text x="25" y="528" fill="#9fb1bd">Просмотр команд</text></g></g>
