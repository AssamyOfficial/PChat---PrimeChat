<text x="70" y="105" fill="url(#g)" font-family="Arial Black, sans-serif" font-size="54" letter-spacing="4">УСТАНОВКА И ПОДДЕРЖКА</text>
<g font-family="Arial, sans-serif"><g transform="translate(65 165)"><rect width="520" height="385" rx="14" fill="#0d2117" stroke="#39d98a"/><text x="25" y="50" fill="#78f0aa" font-size="30" font-weight="700">БЫСТРЫЙ СТАРТ</text><g fill="#e5eef3" font-size="21"><text x="25" y="95">01  Скачайте PrimeChat-1.3.0.jar</text><text x="25" y="145">02  Поместите JAR в plugins/</text><text x="25" y="195">03  Запустите или перезапустите сервер</text><text x="25" y="245">04  Настройте config.yml и command.yml</text><text x="25" y="295">05  Выполните /pc reload</text><text x="25" y="345" fill="#78f0aa">Готово — чат полностью готов к работе</text></g></g>
<g transform="translate(615 165)"><rect width="520" height="385" rx="14" fill="#0a1d28" stroke="#00e5ff"/><text x="25" y="50" fill="#70edff" font-size="30" font-weight="700">ТРЕБОВАНИЯ</text><g fill="#e5eef3" font-size="21"><text x="25" y="95">Paper 1.21.x</text><text x="25" y="135">Java 21</text><text x="25" y="175">PlaceholderAPI — необязательно</text><text x="25" y="235" fill="#9fb1bd">Исходный код открыт на GitHub.</text><text x="25" y="285" fill="#9fb1bd">Баги и предложения можно отправлять</text><text x="25" y="320" fill="#9fb1bd">через Issues репозитория.</text><text x="25" y="370" fill="#70edff">PRIMEDEV • PRIMECHAT</text></g></g></g>
