<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050b12"/><stop offset="1" stop-color="#0b1722"/></linearGradient><linearGradient id="g" x2="1"><stop stop-color="#00e5ff"/><stop offset="1" stop-color="#7c4dff"/></linearGradient><pattern id="p" width="28" height="28" patternUnits="userSpaceOnUse"><rect width="28" height="28" fill="#071019"/><rect width="14" height="14" fill="#0a151f"/><rect x="14" y="14" width="14" height="14" fill="#0a151f"/></pattern></defs>
<rect width="1200" height="900" fill="url(#bg)"/><rect x="18" y="18" width="1164" height="864" rx="22" fill="url(#p)" stroke="#ffc107" stroke-width="3"/><rect x="38" y="38" width="1124" height="824" rx="16" fill="#071019" opacity=".94"/>
<text x="70" y="105" fill="url(#g)" font-family="Arial Black, sans-serif" font-size="54" letter-spacing="4">НАСТРОЙКИ И ПРАВА</text><text x="72" y="140" fill="#9fb1bd" font-family="Arial, sans-serif" font-size="20">Два файла — две зоны ответственности: функции и команды</text>
<g font-family="Arial, sans-serif">
<g transform="translate(65 185)"><rect width="510" height="300" rx="14" fill="#0a1d28" stroke="#00e5ff"/><text x="25" y="48" fill="#70edff" font-size="31" font-weight="700">config.yml</text><g fill="#e5eef3" font-size="20"><text x="25" y="90">• каналы и радиусы</text><text x="25" y="125">• форматы, HEX и градиенты</text><text x="25" y="160">• упоминания и звуки</text><text x="25" y="195">• AFK и «Вас никто не услышал»</text><text x="25" y="230">• цветной чат</text><text x="25" y="265">• PlaceholderAPI</text></g></g>
<g transform="translate(625 185)"><rect width="510" height="300" rx="14" fill="#10142a" stroke="#7c4dff"/><text x="25" y="48" fill="#cbbcff" font-size="31" font-weight="700">command.yml</text><g fill="#e5eef3" font-size="20"><text x="25" y="90">• /msg и /r</text><text x="25" y="125">• SocialSpy и CommandSpy</text><text x="25" y="160">• /cc и /afk</text><text x="25" y="195">• /chat on/off</text><text x="25" y="230">• whitelist / blacklist</text><text x="25" y="265">• задержки и все тексты команд</text></g></g>
<g transform="translate(65 525)"><rect width="1070" height="235" rx="14" fill="#17140a" stroke="#ffc107"/><text x="25" y="50" fill="#ffe08a" font-size="30" font-weight="700">PERMISSIONS</text><g fill="#e5eef3" font-size="19"><text x="25" y="90">primechat.admin — управление PrimeChat</text><text x="25" y="122">primechat.msg — личные сообщения • primechat.chatcolor — цветной чат</text><text x="25" y="154">primechat.socialspy • primechat.commandspy • primechat.clearchat • primechat.afk</text><text x="25" y="186">primechat.chat.toggle • primechat.chat.bypass • primechat.commandcontrol.bypass</text><text x="570" y="90">primechat.commanddelay.reduce</text><text x="570" y="122">primechat.commanddelay.bypass</text><text x="570" y="154">Права каналов задаются прямо в config.yml</text></g></g></g>
<text x="600" y="820" text-anchor="middle" fill="#6fe8ff" font-family="Arial Black, sans-serif" font-size="21" letter-spacing="3">EDIT • SAVE • /pc reload</text>
</svg>