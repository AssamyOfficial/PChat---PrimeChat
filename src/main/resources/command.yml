# ============================================================================
# PrimeChat 1.3.0 | Команды
# ============================================================================
# Этот файл отвечает только за команды и их сообщения.
# Основная настройка каналов и функций находится в config.yml.
#
# MiniMessage и HEX поддерживаются во всех сообщениях.
# Примеры:
#   <red>Красный</red>
#   <#00E5FF>HEX</#00E5FF>
#   <gradient:#00E5FF:#7C4DFF>Градиент</gradient>
#
# PlaceholderAPI также поддерживается.
#
# Для многострочного сообщения просто добавьте несколько строк в список.
# ============================================================================

commands:

  # ========================================================================== 
  # /msg | /m | /message
  # ========================================================================== 
  msg:
    enabled: true
    permission: "primechat.msg"

    messages:
      player-only: "<red>Эта команда доступна только игрокам.</red>"
      disabled: "<red>Личные сообщения отключены.</red>"
      no-permission: "<red>У вас нет прав для использования личных сообщений.</red>"
      usage: "<gray>Использование: <white>/msg <игрок> <сообщение></white></gray>"
      player-not-found: "<red>Игрок <white>%player%</white> не найден или не в сети.</red>"
      self: "<yellow>Вы не можете отправить сообщение самому себе.</yellow>"

      format:
        outgoing:
          - "<gray>Вы → <#00E5FF>%recipient%</#00E5FF></gray>"
          - "<white>%message%</white>"
        incoming:
          - "<gray>От <#00E5FF>%sender%</#00E5FF></gray>"
          - "<white>%message%</white>"

  # ========================================================================== 
  # /r | /reply
  # ========================================================================== 
  r:
    enabled: true

    messages:
      player-only: "<red>Эта команда доступна только игрокам.</red>"
      disabled: "<red>Ответы на личные сообщения отключены.</red>"
      no-permission: "<red>У вас нет прав для использования личных сообщений.</red>"
      usage: "<gray>Использование: <white>/r <сообщение></white></gray>"
      no-target: "<yellow>У вас нет собеседника для ответа.</yellow>"
      target-offline: "<yellow>Ваш последний собеседник сейчас не в сети.</yellow>"

# ============================================================================
# Доступные placeholders для /msg:
#
# %sender%                 — ник отправителя
# %sender_displayname%     — Display Name отправителя
# %recipient%              — ник получателя
# %recipient_displayname%  — Display Name получателя
# %message%                — текст сообщения
#
# Для сообщений об ошибках /msg дополнительно:
# %player%                 — указанный ник игрока
# ============================================================================
