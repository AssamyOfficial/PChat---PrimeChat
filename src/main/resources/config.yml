# ============================================================
# PrimeChat 1.2.0
# Документация конфигурации
# ============================================================
#
# Форматы сообщений используют MiniMessage.
# Примеры:
#   <red>Красный текст</red>
#   <bold>Жирный текст</bold>
#   <underlined>Подчёркнутый текст</underlined>
#   <#00BFFF>HEX-цвет</#00BFFF>
#   <gradient:#00BFFF:#8A2BE2>Градиент</gradient>
#
# Основные placeholders PrimeChat:
#   %player%       — ник игрока
#   %displayname%  — Display Name игрока
#   %display_name% — альтернативное имя для %displayname%
#   %message%      — текст сообщения
#
# Если установлен PlaceholderAPI, в форматах можно использовать
# его placeholders.
# ============================================================

# ============================================================
# ВЗАИМОДЕЙСТВИЕ С НИКОМ ИГРОКА
# ============================================================
#
# Hover отображается при наведении на ник.
# Click выполняет действие при нажатии на ник.
# ============================================================

player-interaction:
  hover:
    enabled: true
    text:
      - "<aqua>👤 <bold>%player%</bold></aqua>"
      - "<gray>Игрок сервера</gray>"
      - ""
      - "<yellow>Нажмите, чтобы написать сообщение</yellow>"

  click:
    enabled: true
    action: "suggest-message"

# ============================================================
# УПОМИНАНИЯ
# ============================================================
#
# Игрок упоминается через @Ник.
# Можно упомянуть нескольких игроков в одном сообщении:
#   @PlayerOne @PlayerTwo привет!
#
# Уведомление онлайн-игроку отправляется только тогда, когда
# игрок реально получил сообщение канала. Поэтому упоминание
# игрока за пределами радиуса локального чата уведомление не
# отправит.
#
# При упоминании самого себя уведомление не отправляется.
#
# offline — игрок известен серверу, но сейчас не в сети.
# not-found — сервер не знает такого игрока.
# ============================================================

mentions:
  enabled: true
  symbol: "@"
  color: "<aqua>"
  clickable: true
  hover: true

  notification:
    enabled: true
    message: "<yellow>🔔 <white>%player%</white> упомянул Вас в чате.</yellow>"
    offline: "<yellow>⚠ Игрок <white>%player%</white> сейчас не в сети.</yellow>"
    not-found: "<red>⚠ Игрок <white>%player%</white> не найден.</red>"

# ============================================================
# КАНАЛЫ
# ============================================================
#
# Каждый раздел внутри channels — отдельный канал.
# Для добавления нового канала достаточно создать новый раздел.
# Java-код изменять не требуется.
#
# Параметры:
#   enabled    — включён ли канал.
#   mode       — local, global или command.
#   trigger    — префикс для вызова канала из обычного чата.
#   command    — команда командного канала без '/'.
#   aliases    — дополнительные имена команды.
#   permission — permission для отправки и получения сообщений.
#   radius     — радиус локального канала. 0 = без ограничения.
#   format     — формат сообщения.
#
# Режимы:
#   local   — сообщение получают игроки в пределах radius.
#   global  — сообщение получают игроки без ограничения расстоянием.
#   command — сообщение отправляется через command и aliases.
# ============================================================

channels:

  # ------------------------------------------------------------
  # LOCAL CHAT
  # ------------------------------------------------------------
  local:
    enabled: true
    mode: "local"
    trigger: ""
    command: ""
    aliases: []
    permission: ""
    radius: 100
    format: "<gray>[L]</gray> <aqua>%player%</aqua> <gray>»</gray> <white>%message%</white>"

    # Если этот блок отсутствует, используется глобальный
    # unheard-message ниже.
    unheard-message:
      enabled: true
      message: "<yellow>⚠ В радиусе никто не услышал Вас.</yellow>"

  # ------------------------------------------------------------
  # GLOBAL CHAT
  # ------------------------------------------------------------
  global:
    enabled: true
    mode: "global"
    trigger: "!"
    command: ""
    aliases: []
    permission: ""
    radius: 0
    format: "<gray>[G]</gray> <green>%player%</green> <gray>»</gray> <white>%message%</white>"

  # ------------------------------------------------------------
  # ADMIN CHAT
  # ------------------------------------------------------------
  admin:
    enabled: true
    mode: "command"
    trigger: ""
    command: "ac"
    aliases:
      - "adminchat"
    permission: "primechat.admin"
    radius: 0
    format: "<red>[ADMIN]</red> <red>%player%</red> <gray>»</gray> <white>%message%</white>"

  # ------------------------------------------------------------
  # DONATE CHAT
  # ------------------------------------------------------------
  donate:
    enabled: true
    mode: "command"
    trigger: ""
    command: "dc"
    aliases:
      - "donatechat"
    permission: "primechat.donate"
    radius: 0
    format: "<gold>[D]</gold> <gray>|</gray> <aqua>%player%</aqua> <gray>-</gray> <white>%message%</white>"

  # ------------------------------------------------------------
  # STAFF CHAT
  # ------------------------------------------------------------
  staff:
    enabled: true
    mode: "command"
    trigger: ""
    command: "sc"
    aliases:
      - "staffchat"
    permission: "primechat.staff"
    radius: 0
    format: "<dark_aqua>[STAFF]</dark_aqua> <gray>|</gray> <aqua>%player%</aqua> <gray>-</gray> <white>%message%</white>"

# ============================================================
# ЦВЕТНОЙ ЧАТ
# ============================================================
#
# Permission из этой настройки определяет, кто может использовать
# цветное и форматированное сообщение.
# ============================================================

chat-color:
  enabled: true
  permission: "primechat.chatcolor"

# ============================================================
# ЕСЛИ НИКТО НЕ УСЛЫШАЛ
# ============================================================
#
# Сообщение отправляется отправителю, если после применения
# правил канала ни один другой игрок не получил сообщение.
#
# enabled: false полностью отключает функцию для всех каналов.
#
# Если конкретный канал содержит свой unheard-message, его
# настройки имеют приоритет над глобальными.
# ============================================================

unheard-message:
  enabled: true
  message: "<red>⚠</red> <gray>Вас никто не услышал.</gray>"
