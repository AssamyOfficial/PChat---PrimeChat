# ============================================================
# PrimeChat 1.3.0 — ОСНОВНЫЕ НАСТРОЙКИ
# ============================================================
# Этот файл отвечает за внешний вид и основные функции плагина.
# Настройки команд и их сообщений находятся в command.yml.
# После изменений используйте /pc reload.
#
# PrimeChat использует MiniMessage.
# HEX:       <#00E5FF>текст</#00E5FF>
# Градиент:  <gradient:#00E5FF:#7C4DFF>текст</gradient>
# Жирный:   <bold>текст</bold>
# Курсив:   <italic>текст</italic>
#
# Основные placeholders:
# %player%           — ник игрока
# %displayname%      — Display Name игрока
# %display_name%     — альтернативная запись Display Name
# %message%          — текст сообщения
#
# Если установлен PlaceholderAPI, его placeholders также доступны.

# ============================================================
# ВЗАИМОДЕЙСТВИЕ С НИКАМИ
# ============================================================
# Настройка hover-окна и клика по нику в сообщении.
# action: suggest-message предлагает команду /msg <ник>.

player-interaction:
  hover:
    enabled: true
    text:
      - "<gradient:#00E5FF:#7C4DFF><bold>%player%</bold></gradient>"
      - "<gray>Игрок сервера</gray>"
      - ""
      - "<gray>Нажмите, чтобы написать сообщение</gray>"
  click:
    enabled: true
    action: "suggest-message"

# ============================================================
# УПОМИНАНИЯ
# ============================================================
# Игрока можно упомянуть через @ник.
# Поддерживается несколько упоминаний в одном сообщении.
# Цифры и символ _ в никах поддерживаются.
# Онлайн-игрок получает уведомление только если реально получил
# исходное сообщение. Самоупоминание уведомление не создаёт.

mentions:
  enabled: true
  symbol: "@"
  color: "<#00E5FF>"
  clickable: true
  hover: true
  notification:
    enabled: true
    message: "<#00E5FF>◆</#00E5FF> <gray>%player% упомянул Вас в чате.</gray>"
    offline: "<yellow>⚠</yellow> <gray>Игрок <white>%player%</white> сейчас не в сети.</gray>"
    not-found: "<red>⚠</red> <gray>Игрок <white>%player%</white> не найден.</gray>"
    sound:
      enabled: true
      name: "ENTITY_EXPERIENCE_ORB_PICKUP"
      volume: 1.0
      pitch: 1.0

# Пример:
# @Assamy_ @Assamy_2 Привет!
#
# sound.enabled: false — полностью отключает звук упоминания.
# name должен соответствовать названию звука Paper/Spigot.

# ============================================================
# КАНАЛЫ
# ============================================================
# Каналы создаются автоматически из раздела channels.
# Добавить новый канал можно без изменения Java-кода.
# После добавления выполните /pc reload.
#
# mode:
#   local   — сообщение получают игроки рядом с отправителем
#   global  — сообщение получают все подходящие игроки
#   command — канал вызывается отдельной командой
#
# trigger — символ быстрого вызова канала в обычном чате.
# command — команда канала без '/'.
# aliases — дополнительные названия команды.
# permission — право на использование/получение канала.
# radius — радиус local-канала в блоках.
# format — внешний вид сообщения.
# Для новых command-каналов Tab Completion создаётся автоматически.

channels:
  local:
    enabled: true
    mode: "local"
    trigger: ""
    command: ""
    aliases: []
    permission: ""
    radius: 100
    format: "<#00E5FF>Ⓛ</#00E5FF> <#00E5FF>%player%</#00E5FF> <gray>»</gray> <white>%message%</white>"
    unheard-message:
      enabled: true
      message: "<red>⚠</red> <gray>В радиусе никто не услышал Вас.</gray>"

  global:
    enabled: true
    mode: "global"
    trigger: "!"
    command: ""
    aliases: []
    permission: ""
    radius: 0
    format: "<#7C4DFF>Ⓖ</#7C4DFF> <#7C4DFF>%player%</#7C4DFF> <gray>»</gray> <white>%message%</white>"

  admin:
    enabled: true
    mode: "command"
    trigger: ""
    command: "ac"
    aliases:
      - "adminchat"
    permission: "primechat.admin"
    radius: 0
    format: "<gradient:#FF5252:#FF1744>◆ ADMIN</gradient> <#FF5252>%player%</#FF5252> <gray>»</gray> <white>%message%</white>"

  donate:
    enabled: true
    mode: "command"
    trigger: ""
    command: "dc"
    aliases:
      - "donatechat"
    permission: "primechat.donate"
    radius: 0
    format: "<gradient:#FFD54F:#FF8F00>◆ DONATE</gradient> <#00E5FF>%player%</#00E5FF> <gray>»</gray> <white>%message%</white>"

# Пример собственного канала:
#
# vip:
#   enabled: true
#   mode: "command"
#   trigger: ""
#   command: "vip"
#   aliases:
#     - "v"
#   permission: "primechat.vip"
#   radius: 0
#   format: "<#FFD54F>◆ VIP</#FFD54F> <#00E5FF>%player%</#00E5FF> <gray>»</gray> <white>%message%</white>"
#
# После /pc reload появятся /vip и /v, а Tab Completion подхватит канал автоматически.

# ============================================================
# ЦВЕТНОЙ ЧАТ
# ============================================================
# Игрок с указанным permission может использовать MiniMessage и HEX
# непосредственно в своём сообщении.
# Пример: <#00E5FF>Привет!</#00E5FF>

chat-color:
  enabled: true
  permission: "primechat.chatcolor"

# ============================================================
# «ВАС НИКТО НЕ УСЛЫШАЛ»
# ============================================================
# Сообщение появляется, если после фильтрации канала его не получил
# ни один другой игрок.
# Можно отключить глобально и включить только в отдельных каналах.

unheard-message:
  enabled: true
  message: "<red>⚠</red> <gray>Вас никто не услышал.</gray>"

# Переопределение для конкретного канала:
#
# local:
#   unheard-message:
#     enabled: true
#     message: "<red>⚠</red> <gray>В радиусе никто не услышал Вас.</gray>"
#
# Если channel.unheard-message не указан, используется глобальная настройка.
