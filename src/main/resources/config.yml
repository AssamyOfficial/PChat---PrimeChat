# ============================================================
#                    PRIME CHAT
#                 by PrimeDev (Assamy_)
# ============================================================

# ============================================================
# Взаимодействие с именем игрока
# ============================================================

player-interaction:

  hover:
    enabled: true

    text:
      - "<aqua>👤 <bold>%player%</bold></aqua>"
      - "<gray>Игрок сервера</gray>"
      - ""
      - "<yellow>Нажмите, чтобы написать сообщение</yellow>"

  click:
    enabled: true
    action: "suggest-message"


# ============================================================
# Упоминания игроков
# ============================================================

mentions:

  enabled: true

  symbol: "@"

  color: "<aqua>"

  clickable: true

  hover: true

  notification:

    # Включить уведомления об упоминаниях
    enabled: true

    # Игрок онлайн
    message: "<yellow>🔔 <white>%player%</white> упомянул Вас в чате.</yellow>"

    # Игрок существует, но сейчас не в сети
    offline: "<yellow>⚠ Игрок <white>%player%</white> сейчас не в сети.</yellow>"

    # Такого игрока сервер не знает
    not-found: "<red>⚠ Игрок <white>%player%</white> не найден.</red>"


# ============================================================
# CHAT CHANNELS
# ============================================================

channels:

  # ==========================================================
  # LOCAL
  # ==========================================================

  local:

    enabled: true

    mode: "local"

    trigger: ""

    command: ""

    permission: ""

    radius: 100

    format: "<gray>[L]</gray> <aqua>%player%</aqua> <gray>»</gray> <white>%message%</white>"


  # ==========================================================
  # GLOBAL
  # ==========================================================

  global:

    enabled: true

    mode: "global"

    trigger: "!"

    command: ""

    permission: ""

    radius: 0

    format: "<gray>[G]</gray> <green>%player%</green> <gray>»</gray> <white>%message%</white>"


  # ==========================================================
  # ADMIN CHAT
  # ==========================================================

  admin:

    enabled: true

    mode: "command"

    trigger: ""

    command: "ac"

    permission: "primechat.admin"

    radius: 0

    format: "<red>[ADMIN]</red> <red>%player%</red> <gray>»</gray> <white>%message%</white>"


  # ==========================================================
  # DONATE CHAT
  # ==========================================================

  donate:

    enabled: true

    mode: "command"

    trigger: ""

    command: "dc"

    permission: "primechat.donate"

    radius: 0

    format: "<gold>[D]</gold> <gray>|</gray> <aqua>%player%</aqua> <gray>-</gray> <white>%message%</white>"


  # ==========================================================
  # STAFF CHAT
  # ==========================================================

  staff:

    enabled: true

    mode: "command"

    trigger: ""

    command: "sc"

    permission: "primechat.staff"

    radius: 0

    format: "<dark_aqua>[STAFF]</dark_aqua> <gray>|</gray> <aqua>%player%</aqua> <gray>-</gray> <white>%message%</white>"

# ============================================================
#                    ЦВЕТНОЙ ЧАТ
# ============================================================

chat-color:

  # Разрешить игрокам использовать цвета и форматирование
  enabled: true

  # Permission для использования цветов
  permission: "primechat.chatcolor"

# ============================================================
#              ЕСЛИ НИКТО НЕ УСЛЫШАЛ
# ============================================================

unheard-message:

  # Глобально включает / выключает функцию.
  #
  # false — функция полностью отключена
  # для всех каналов.
  enabled: true

  # Сообщение по умолчанию.
  message: "<red>⚠</red> <grey>Вас никто не услышал.</grey>"