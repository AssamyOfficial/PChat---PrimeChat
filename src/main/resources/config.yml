# PrimeChat 1.3.0
# MiniMessage поддерживает HEX и градиенты.
# Примеры: <#00E5FF>текст</#00E5FF>, <gradient:#00E5FF:#7C4DFF>текст</gradient>
# Основные placeholders: %player%, %displayname%, %display_name%, %message%.
# После изменений используйте /pc reload.

player-interaction:
  hover:
    enabled: true
    text:
      - "<gradient:#00E5FF:#7C4DFF><bold>%player%</bold></gradient>"
      - "<gray>Игрок сервера</gray>"
      - ""
      - "<gray>Нажмите, чтобы написать сообщение</gray>"
  click:
    enabled: true
    action: "suggest-message"

mentions:
  enabled: true
  symbol: "@"
  color: "<#00E5FF>"
  clickable: true
  hover: true
  notification:
    enabled: true
    message: "<#00E5FF>◆</#00E5FF> <gray>%player% упомянул Вас в чате.</gray>"
    offline: "<yellow>⚠</yellow> <gray>Игрок <white>%player%</white> сейчас не в сети.</gray>"
    not-found: "<red>⚠</red> <gray>Игрок <white>%player%</white> не найден.</gray>"
    sound:
      enabled: true
      name: "ENTITY_EXPERIENCE_ORB_PICKUP"
      volume: 1.0
      pitch: 1.0

# Каналы создаются автоматически из этого раздела.
# mode: local, global или command.
# local ограничивает сообщение радиусом в одном мире.
# global отправляет сообщение всем подходящим игрокам.
# command создаёт канал с командой и aliases.
# permission ограничивает использование канала.
# radius используется для local.
# format определяет внешний вид сообщения.
# unheard-message.enabled/message позволяют переопределить глобальное уведомление.
# Для нового канала достаточно добавить новый блок и выполнить /pc reload.

channels:
  local:
    enabled: true
    mode: "local"
    trigger: ""
    command: ""
    aliases: []
    permission: ""
    radius: 100
    format: "<#00E5FF>Ⓛ</#00E5FF> <#00E5FF>%player%</#00E5FF> <gray>»</gray> <white>%message%</white>"
    unheard-message:
      enabled: true
      message: "<red>⚠</red> <gray>В радиусе никто не услышал Вас.</gray>"

  global:
    enabled: true
    mode: "global"
    trigger: "!"
    command: ""
    aliases: []
    permission: ""
    radius: 0
    format: "<#7C4DFF>Ⓖ</#7C4DFF> <#7C4DFF>%player%</#7C4DFF> <gray>»</gray> <white>%message%</white>"

  admin:
    enabled: true
    mode: "command"
    trigger: ""
    command: "ac"
    aliases:
      - "adminchat"
    permission: "primechat.admin"
    radius: 0
    format: "<gradient:#FF5252:#FF1744>◆ ADMIN</gradient> <#FF5252>%player%</#FF5252> <gray>»</gray> <white>%message%</white>"

  donate:
    enabled: true
    mode: "command"
    trigger: ""
    command: "dc"
    aliases:
      - "donatechat"
    permission: "primechat.donate"
    radius: 0
    format: "<gradient:#FFD54F:#FF8F00>◆ DONATE</gradient> <#00E5FF>%player%</#00E5FF> <gray>»</gray> <white>%message%</white>"

chat-color:
  enabled: true
  permission: "primechat.chatcolor"

unheard-message:
  enabled: true
  message: "<red>⚠</red> <gray>Вас никто не услышал.</gray>"
