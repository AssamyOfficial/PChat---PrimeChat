# ============================================================================
# PrimeChat 1.2.0 | Основная конфигурация
# ============================================================================
#
# PrimeChat использует MiniMessage для цветов и форматирования.
# HEX поддерживается напрямую.
#
# Быстрые примеры:
#   <red>Красный</red>
#   <bold>Жирный</bold>
#   <italic>Курсив</italic>
#   <underlined>Подчёркнутый</underlined>
#   <#00BFFF>HEX-цвет</#00BFFF>
#   <gradient:#00BFFF:#8A2BE2>Градиент</gradient>
#   <rainbow>Радужный текст</rainbow>
#
# HEX можно использовать в любом формате:
#   <#7C4DFF>Фиолетовый</#7C4DFF>
#   <#00E5FF>Голубой</#00E5FF>
#   <bold><#FFD54F>Золотой текст</#FFD54F></bold>
#
# Основные placeholders PrimeChat:
#   %player%       — ник игрока
#   %displayname%  — Display Name игрока
#   %display_name% — альтернативная запись Display Name
#   %message%      — сообщение игрока
#
# Если установлен PlaceholderAPI, дополнительно доступны его placeholders.
#
# Важно:
#   • Не удаляйте двоеточия, кавычки и отступы YAML.
#   • После изменения конфигурации используйте /primechat reload.
#   • Если канал содержит собственное unheard-message, оно имеет приоритет
#     над глобальным сообщением ниже.
# ============================================================================

# ============================================================================
# ВЗАИМОДЕЙСТВИЕ С ИГРОКОМ
# ============================================================================
# Настройка ника игрока в сообщении: наведение мыши и нажатие.
# ============================================================================

player-interaction:
  hover:
    enabled: true
    text:
      - "<gradient:#00E5FF:#7C4DFF><bold>%player%</bold></gradient>"
      - "<gray>Игрок сервера</gray>"
      - ""
      - "<yellow>Нажмите, чтобы написать сообщение</yellow>"

  click:
    enabled: true
    action: "suggest-message"

# Доступное действие:
#   suggest-message — предлагает в чате команду /msg <ник>.

# ============================================================================
# УПОМИНАНИЯ
# ============================================================================
# Игрока можно упомянуть через @Ник.
# Несколько игроков в одном сообщении:
#   @Assamy_ @Assamy_2 Привет всем!
#
# Онлайн-игрок получает уведомление только если реально получил сообщение
# выбранного канала. Например, игрок за пределами радиуса local-канала
# уведомление не получит.
#
# Упоминание самого себя уведомление не создаёт.
#
# offline  — игрок существует в истории сервера, но сейчас не в сети.
# not-found — такого игрока сервер ещё не знает.
# ============================================================================

mentions:
  enabled: true
  symbol: "@"

  # Цвет выделения упоминания.
  color: "<#00E5FF>"

  clickable: true
  hover: true

  notification:
    enabled: true

    # %player% — ник отправителя упоминания.
    message: "<gradient:#00E5FF:#7C4DFF>🔔</gradient> <gray>%player% упомянул Вас в чате.</gray>"

    # Сообщение отправителю, если упомянутый игрок известен серверу,
    # но находится офлайн.
    offline: "<yellow>⚠</yellow> <gray>Игрок <white>%player%</white> сейчас не в сети.</gray>"

    # Сообщение отправителю, если такого игрока сервер не знает.
    not-found: "<red>⚠</red> <gray>Игрок <white>%player%</white> не найден.</gray>"

# ============================================================================
# КАНАЛЫ
# ============================================================================
# Каждый раздел внутри channels — отдельный чат.
# Новый канал можно добавить без изменения Java-кода.
#
# Параметры:
#   enabled     — true/false, включён ли канал.
#   mode        — local, global или command.
#   trigger     — префикс канала в обычном сообщении.
#   command     — команда командного канала без '/'.
#   aliases     — дополнительные команды канала.
#   permission  — право на отправку и получение сообщений.
#   radius      — радиус local-канала.
#   format      — внешний вид сообщения.
#
# Режимы:
#   local   — сообщение получают игроки в одном мире в пределах radius.
#   global  — сообщение получают игроки без ограничения расстоянием.
#   command — сообщение отправляется через указанную команду.
#
# Пример нового глобального канала:
#
#   vip:
#     enabled: true
#     mode: "global"
#     trigger: "!!"
#     command: ""
#     aliases: []
#     permission: "primechat.vip"
#     radius: 0
#     format: "<#FFD54F>[VIP]</#FFD54F> <#00E5FF>%player%</#00E5FF> <gray>»</gray> <white>%message%</white>"
#
# После добавления канала выполните /primechat reload.
# ============================================================================

channels:

  # --------------------------------------------------------------------------
  # LOCAL | Локальный чат
  # --------------------------------------------------------------------------
  local:
    enabled: true
    mode: "local"
    trigger: ""
    command: ""
    aliases: []
    permission: ""
    radius: 100

    format: "<#5C6BC0>[L]</#5C6BC0> <#00E5FF>%player%</#00E5FF> <gray>»</gray> <white>%message%</white>"

    # Настройка имеет приоритет над глобальным unheard-message.
    unheard-message:
      enabled: true
      message: "<yellow>⚠</yellow> <gray>В радиусе никто не услышал Вас.</gray>"

  # --------------------------------------------------------------------------
  # GLOBAL | Глобальный чат
  # --------------------------------------------------------------------------
  # Использование: !Привет всем!
  # --------------------------------------------------------------------------
  global:
    enabled: true
    mode: "global"
    trigger: "!"
    command: ""
    aliases: []
    permission: ""
    radius: 0

    format: "<gradient:#00E5FF:#7C4DFF>[G]</gradient> <#7C4DFF>%player%</#7C4DFF> <gray>»</gray> <white>%message%</white>"

  # --------------------------------------------------------------------------
  # ADMIN | Административный чат
  # --------------------------------------------------------------------------
  # Команды: /ac и /adminchat
  # --------------------------------------------------------------------------
  admin:
    enabled: true
    mode: "command"
    trigger: ""
    command: "ac"
    aliases:
      - "adminchat"
    permission: "primechat.admin"
    radius: 0

    format: "<gradient:#FF5252:#FF1744>[ADMIN]</gradient> <#FF5252>%player%</#FF5252> <gray>»</gray> <white>%message%</white>"

  # --------------------------------------------------------------------------
  # DONATE | Донат-чат
  # --------------------------------------------------------------------------
  # Команды: /dc и /donatechat
  # --------------------------------------------------------------------------
  donate:
    enabled: true
    mode: "command"
    trigger: ""
    command: "dc"
    aliases:
      - "donatechat"
    permission: "primechat.donate"
    radius: 0

    format: "<gradient:#FFD54F:#FF8F00>[DONATE]</gradient> <#00E5FF>%player%</#00E5FF> <gray>»</gray> <white>%message%</white>"

  # --------------------------------------------------------------------------
  # STAFF | Чат персонала
  # --------------------------------------------------------------------------
  # Команды: /sc и /staffchat
  # --------------------------------------------------------------------------
  staff:
    enabled: true
    mode: "command"
    trigger: ""
    command: "sc"
    aliases:
      - "staffchat"
    permission: "primechat.staff"
    radius: 0

    format: "<gradient:#00BCD4:#7C4DFF>[STAFF]</gradient> <#00E5FF>%player%</#00E5FF> <gray>»</gray> <white>%message%</white>"

# ============================================================================
# ЦВЕТНОЙ ЧАТ
# ============================================================================
# Игроки с указанным permission могут использовать MiniMessage в тексте.
#
# Например игрок с primechat.chatcolor может написать:
#   <#00E5FF>Привет</#00E5FF>
#
# Или:
#   <gradient:#00E5FF:#7C4DFF><bold>Красивое сообщение!</bold></gradient>
#
# HEX работает в полном формате #RRGGBB.
# ============================================================================

chat-color:
  enabled: true
  permission: "primechat.chatcolor"

# ============================================================================
# ЕСЛИ НИКТО НЕ УСЛЫШАЛ
# ============================================================================
# Срабатывает, когда после применения всех правил канала отправителя
# не услышал ни один другой игрок.
#
# Чтобы полностью отключить функцию:
#   enabled: false
#
# Чтобы отключить её только в конкретном канале, добавьте:
#   unheard-message:
#     enabled: false
#
# Чтобы оставить функцию только в local, можно отключить глобальную
# настройку и включить её отдельно внутри channels.local.
# ============================================================================

unheard-message:
  enabled: true
  message: "<red>⚠</red> <gray>Вас никто не услышал.</gray>"
